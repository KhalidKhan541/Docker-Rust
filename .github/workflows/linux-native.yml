name: linux-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux workspace + native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # The runtime-spec schema tests read `upstream/runtime-spec/schema/`,
      # which is gitignored by design (see docs/REVERSE_ENGINEERING.md).
      # CI populates it at the same pinned revision as local checkouts.
      - name: Fetch pinned runtime-spec schemas
        run: |
          mkdir -p upstream/runtime-spec
          curl -fsSL -o /tmp/runtime-spec.tar.gz \
            "https://codeload.github.com/opencontainers/runtime-spec/tar.gz/92249139eea7161e13745abd4cb6d0ea02a3227a"
          echo "fbed724a4bbdce2260eea9a4d6dcf534a5e2446e581ed1b8bf27abe536cee17a  /tmp/runtime-spec.tar.gz" | sha256sum -c -
          tar -xzf /tmp/runtime-spec.tar.gz --strip-components=1 -C upstream/runtime-spec

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

      - name: Static console smoke test
        run: |
          set +e
          set -o pipefail
          bash tests/static-console-smoke.sh 2>&1 | tee static-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Static console smoke test"
            echo
            echo '```'
            cat static-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            excerpt=$(tail -c 8000 static-smoke.log)
            excerpt=${excerpt//'%'/'%25'}
            excerpt=${excerpt//$'\r'/'%0D'}
            excerpt=${excerpt//$'\n'/'%0A'}
            echo "::error title=Static console smoke test::${excerpt}"
          fi
          exit "$status"

      - name: Build native runtime smoke test
        run: cargo test -p docker-rs-integration --test native_runtime --no-run --message-format=json > native-test-artifacts.json

      # The runner's shell runs with `-e`, so a failing pipeline would abort
      # before the exit code is captured or the report is written. Disable it
      # around the test invocation and restore it afterwards.
      #
      # The report is written to two places because they have different
      # audiences: `$GITHUB_STEP_SUMMARY` is rendered in the Actions UI, while
      # the workflow `::error` annotation is retrievable anonymously through
      # the public check-runs API (`/check-runs/{id}/annotations`) for a public
      # repository. Log downloads require admin rights, so the annotation is
      # the only machine-readable failure channel for an unauthenticated agent.
      - name: Native runtime smoke test (root)
        run: |
          TEST_BIN=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_runtime" and .executable != null) | .executable' native-test-artifacts.json | tail -n 1)
          test -n "$TEST_BIN"
          set +e
          set -o pipefail
          sudo --preserve-env=PATH,RUST_BACKTRACE "$TEST_BIN" --ignored --nocapture 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Native runtime smoke test"
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            excerpt=$(tail -c 8000 smoke.log)
            excerpt=${excerpt//'%'/'%25'}
            excerpt=${excerpt//$'\r'/'%0D'}
            excerpt=${excerpt//$'\n'/'%0A'}
            echo "::error title=Native runtime smoke test (root)::${excerpt}"
          fi
          exit "$status"
        env:
          RUST_BACKTRACE: 1

      - name: Engine API native smoke test (root)
        run: |
          set +e
          set -o pipefail
          sudo --preserve-env=PATH bash tests/linux-native-smoke.sh 2>&1 | tee engine-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            excerpt=$(tail -c 8000 engine-smoke.log)
            excerpt=${excerpt//'%'/'%25'}
            excerpt=${excerpt//$'\r'/'%0D'}
            excerpt=${excerpt//$'\n'/'%0A'}
            echo "::error title=Engine API native smoke test (root)::${excerpt}"
          fi
          exit "$status"
