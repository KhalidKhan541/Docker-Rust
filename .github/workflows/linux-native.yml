name: linux-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux workspace + native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # The runtime-spec schema tests read `upstream/runtime-spec/schema/`,
      # which is gitignored by design (see docs/REVERSE_ENGINEERING.md).
      # CI populates it at the same pinned revision as local checkouts.
      - name: Fetch pinned runtime-spec schemas
        run: |
          mkdir -p upstream/runtime-spec
          curl -fsSL -o /tmp/runtime-spec.tar.gz \
            "https://codeload.github.com/opencontainers/runtime-spec/tar.gz/92249139eea7161e13745abd4cb6d0ea02a3227a"
          echo "fbed724a4bbdce2260eea9a4d6dcf534a5e2446e581ed1b8bf27abe536cee17a  /tmp/runtime-spec.tar.gz" | sha256sum -c -
          tar -xzf /tmp/runtime-spec.tar.gz --strip-components=1 -C upstream/runtime-spec

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

      - name: Build native runtime smoke test
        run: cargo test -p docker-rs-integration --test native_runtime --no-run --message-format=json > native-test-artifacts.json

      - name: Native runtime smoke test (root)
        run: |
          TEST_BIN=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_runtime" and .executable != null) | .executable' native-test-artifacts.json | tail -n 1)
          test -n "$TEST_BIN"
          set -o pipefail
          sudo --preserve-env=PATH,RUST_BACKTRACE "$TEST_BIN" --ignored --nocapture 2>&1 | tee smoke.log
          status=$?
          {
            echo "### Native runtime smoke test"
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          RUST_BACKTRACE: 1

      - name: Engine API native smoke test (root)
        run: sudo --preserve-env=PATH bash tests/linux-native-smoke.sh
