# docker-rs — Rust-native reimplementation of the Docker ecosystem
#
# Workspace root. Every implemented crate has a single, clearly documented
# responsibility. See README.md and docs/ for reverse-engineering records.

[workspace]
resolver = "2"
members = [
    "crates/errors",
    "crates/common",
    "crates/image",
    "crates/storage",
    "crates/distribution",
    "crates/configuration",
    "crates/logging",
    "crates/events",
    "crates/container-model",
    "crates/runtime",
    "crates/daemon",
    "crates/api",
    "crates/daemon-bin",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/docker-rs"

[workspace.dependencies]
# Internal crates — dependency direction is strictly acyclic:
# container-model -> {common, errors, events}
# configuration   -> {common, errors}
# logging         -> {common, errors}
# events          -> {common, errors, logging}
# image           -> {common, errors}
# storage         -> {common, errors}
# distribution    -> {common, errors, image, storage}
# runtime         -> {common, errors, container-model}
# daemon          -> {common, errors, events, container-model, runtime}
# api             -> {common, errors, events, container-model, daemon}
# daemon-bin      -> {api, configuration, daemon, errors, events, logging}
docker-errors = { path = "crates/errors" }
docker-common = { path = "crates/common" }
docker-image = { path = "crates/image" }
docker-storage = { path = "crates/storage" }
docker-distribution = { path = "crates/distribution" }
docker-configuration = { path = "crates/configuration" }
docker-logging = { path = "crates/logging" }
docker-events = { path = "crates/events" }
docker-container-model = { path = "crates/container-model" }
docker-runtime = { path = "crates/runtime" }
docker-daemon = { path = "crates/daemon" }
docker-api = { path = "crates/api" }

# External dependencies, pinned at conservative major versions.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "local-time"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
native-tls = "0.2"
tiny_http = "0.12"

[profile.dev]
# Binaries must stay small on this 4 GB host; debug info is not needed for
# workspace-local tests.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
